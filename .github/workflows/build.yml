name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'project.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Unzip project
        run: |
          mkdir work
          unzip -q project.zip -d work
          D=$(dirname "$(find work -maxdepth 3 -name settings.gradle | head -1)")
          echo "PROJ=$D" >> $GITHUB_ENV

      - name: Install SDK parts
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | $SDKM --licenses > /dev/null || true
          $SDKM "platforms;android-29" "platforms;android-30" "build-tools;28.0.2" "ndk;21.0.6113669" "cmake;3.10.2.4988404"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/21.0.6113669" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/21.0.6113669" >> $GITHUB_ENV
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/21.0.6113669" >> $GITHUB_ENV

      - name: Build
        working-directory: ${{ env.PROJ }}
        run: |
          printf "android.useAndroidX=true\nandroid.enableJetifier=true\norg.gradle.jvmargs=-Xmx3g\n" > gradle.properties
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tail -n 80

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk
          path: work/**/app/build/outputs/apk/debug/*.apk
