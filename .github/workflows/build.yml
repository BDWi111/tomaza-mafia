name: Build APK

on:
  push:
    paths:
      - 'project.zip'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17 and Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Java 11 for Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Switch to Java 17 for SDK setup
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "PATH=$JAVA_HOME_17_X64/bin:$PATH" >> "$GITHUB_ENV"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install compatible NDK 21
        run: |
          set -e
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME_17_X64/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "ndk;21.4.7075529"
          NDK_PATH="/usr/local/lib/android/sdk/ndk/21.4.7075529"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> "$GITHUB_ENV"

      - name: Unzip project and locate root
        run: |
          set -e
          rm -rf work
          mkdir -p work
          unzip -q project.zip -d work

          PROJECT_DIR=$(find work -maxdepth 4 \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print -quit | xargs dirname)
          if [ -z "$PROJECT_DIR" ]; then
            echo "لم يتم العثور على ملف settings.gradle أو settings.gradle.kts داخل project.zip"
            find work -maxdepth 3
            exit 1
          fi

          find "$PROJECT_DIR" -name ".cxx" -type d -exec rm -rf {} +
          find "$PROJECT_DIR" -name "build" -type d -exec rm -rf {} +

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "تم تحديد مجلد المشروع: $PROJECT_DIR"

      - name: Build
        run: |
          set -e
          export JAVA_HOME="$JAVA_HOME_11_X64"
          export PATH="$JAVA_HOME_11_X64/bin:$PATH"
          cd "$PROJECT_DIR"

          mkdir -p "$HOME/.gradle"
          cat << 'EOF' > "$HOME/.gradle/init.gradle"
          allprojects {
              buildscript {
                  repositories {
                      google()
                      mavenCentral()
                  }
              }
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          find . -maxdepth 4 \( -name "*.gradle" -o -name "*.gradle.kts" \) -exec sed -i '/maven\.aliyun\.com/d' {} +
          printf "android.useAndroidX=true\nandroid.enableJetifier=true\norg.gradle.jvmargs=-Xmx3g\n" > gradle.properties
          chmod +x gradlew

          set +e
          ./gradlew :app:assembleDebug -Pandroid.ndkVersion=21.4.7075529 --stacktrace | tee build.log
          EXIT_CODE=${PIPESTATUS[0]}
          set -e

          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "=== سبب الفشل ==="
            grep -E "error:|FAILURE:|Caused by:" -A 2 build.log | tail -n 25 || tail -n 20 build.log
            exit "$EXIT_CODE"
          fi

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
