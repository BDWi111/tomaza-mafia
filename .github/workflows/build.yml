name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'project.zip'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Unzip project
        run: |
          mkdir -p work
          unzip -q project.zip -d work
          SETTINGS_FILE=$(find work -maxdepth 5 \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "settings.gradle not found inside project.zip"
            ls -la work
            exit 1
          fi
          PROJ=$(dirname "$SETTINGS_FILE")
          echo "PROJ=$PROJ" >> "$GITHUB_ENV"
          echo "Found project at: $PROJ"

      - name: Install SDK parts
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-29" "platforms;android-30" "build-tools;28.0.2" "ndk;21.0.6113669" "cmake;3.10.2.4988404"

      - name: Build
        working-directory: ${{ env.PROJ }}
        run: |
          printf "android.useAndroidX=true\nandroid.enableJetifier=true\norg.gradle.jvmargs=-Xmx3g\n" > gradle.properties
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/*.apk
