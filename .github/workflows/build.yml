name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'project.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Unzip project
        run: |
          mkdir work
          unzip -q project.zip -d work
          D=$(dirname "$(find work -maxdepth 3 -name settings.gradle | head -1)")
          echo "PROJ=$D" >> $GITHUB_ENV

      - name: Install SDK parts
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | $SDKM --licenses > /dev/null || true
          $SDKM "platforms;android-29" "platforms;android-30" "build-tools;28.0.2" "ndk;21.0.6113669" "cmake;3.10.2.4988404"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/21.0.6113669" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/21.0.6113669" >> $GITHUB_ENV
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/21.0.6113669" >> $GITHUB_ENV

      - name: Patch C++ headers
        working-directory: ${{ env.PROJ }}
        run: |
          for f in $(find . -path ./build -prune -o \( -name "*.h" -o -name "*.hpp" \) -path "*pine-core*" -print); do
            grep -q "include <cstddef>" "$f" || sed -i '1i #include <cstddef>\n#include <utility>' "$f"
          done

      - name: Build
        working-directory: ${{ env.PROJ }}
        run: |
          printf "android.useAndroidX=true\nandroid.enableJetifier=true\norg.gradle.jvmargs=-Xmx3g\n" > gradle.properties
          chmod +x gradlew
          set +e
          ./gradlew :app:assembleDebug --stacktrace --continue > build.log 2>&1
          code=$?
          echo "======== SUMMARY (exit $code) ========"
          grep -E "Execution failed for task|error:|What went wrong|Could not" -A3 build.log | head -n 50 | tee summary.txt
          { echo "### exit code $code"; echo '```'; cat summary.txt; echo '```'; } >> $GITHUB_STEP_SUMMARY
          exit $code

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk
          path: work/**/app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: work/**/build.log
